<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f6" />
    <title>小董AI</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f7f6;
        color: #202020;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      }

      main {
        width: min(420px, calc(100vw - 48px));
        padding: 28px;
        border: 1px solid #e7e7e4;
        border-radius: 22px;
        background: #fff;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 22px;
      }

      p {
        margin: 12px 0 0;
        color: #666;
        font-size: 14px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>小董AI</h1>
      <p>正在连接投喂端，请稍候。</p>
    </main>
  </body>
</html>
